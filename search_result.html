{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <h2>{{ title }}</h2>

    {% if results %}
        <ul>
            {% for m in results %}
                <li>{{ m['name'] }} - RM{{ "%.2f"|format(m['price']) }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>没有找到匹配的菜品。</p>
    {% endif %}

    <br>
    <a href="/menus">⬅️ 返回菜单</a>
{% endblock %}

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}餐厅管理系统{% endblock %}</title>
    <!-- 这是 Bootstrap 的官方核心文件，确保引用了！ -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="/restaurant" style="text-decoration: none; color: white;">餐厅管理系统</a>
            <div class="d-flex align-items-center gap-3">
                {% if current_user.is_authenticated %}
                    <span class="navbar-text text-white me-3">👤 {{current_user.username }}</span>
                <a class="nav-link text-white" href="/restaurant">首页</a>
                <a class="nav-link text-white" href="/add_form">添加菜品</a>
                <a class="btn btn-outline-danger btn-sm ms-2" href="/logout">登出</a>
                {% else %}
                    <a class="nav-link text-white" href="/login">登录</a>
                {% endif %}
            </div>
        </div>
     </nav>

     <!-- 页面主体内容 -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
